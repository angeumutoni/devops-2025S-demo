name: Security

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code:
    name: Code scan (Bandit)
    runs-on: ubuntu-latest
    # Policy: warn only. The one finding (B105, Low severity) is fixed, and
    # blocking on Low findings adds noise without a matching risk.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: python -m pip install --upgrade bandit
      - name: Run bandit
        run: bandit -r . -f screen

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # Policy: blocking. Any real secret fails the build, no threshold.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Image scan
    runs-on: ubuntu-latest
    # Policy: blocking on CRITICAL vulnerabilities that have a published fix.
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t campus-notifier:dev .
      - name: Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: campus-notifier:dev
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  iac:
    name: IaC scan
    runs-on: ubuntu-latest
    # Policy: blocking. Insecure Terraform fails the build.
    steps:
      - uses: actions/checkout@v4
      - name: Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          quiet: true
          # Accepted risk, CKV_AWS_136 (ECR encrypted with KMS): this is a
          # teaching repo, the default AES256 encryption is acceptable and a
          # customer-managed KMS key adds cost. Owner: Ange Umutoni.
          # Revisit before any production use.
          skip_check: CKV_AWS_136
          soft_fail: false
