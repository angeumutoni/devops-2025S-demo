repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Use the latest stable version of the Ruff pre-commit hooks.
    rev: v0.1.7 # Replace with the latest version from the repository.
    hooks:
      # Ruff for linting and checking.
      - id: ruff
        # Optional: Add arguments for specific checks or fixes.
        # args: [--fix, --exit-zero-on-fix] # Fix issues and exit with zero if fixes are applied.
      # Ruff for formatting.
      - id: ruff-format
  - repo: local
    hooks:
      - id: gitleaks-docker
        name: Detect hardcoded secrets
        language: system
        pass_filenames: false
        entry: bash -c 'docker run --rm -v "$PWD:/path" -w /path zricethezav/gitleaks:v8.30.1 git --pre-commit --staged --redact -v /path'